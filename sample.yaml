apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-ecr
  labels:
    app: nginx-ecr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-ecr
  template:
    metadata:
      labels:
        app: nginx-ecr
    spec:
      containers:
      - name: nginx
        image: 941377154345.dkr.ecr.us-east-1.amazonaws.com/nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-ecr-service
spec:
  selector:
    app: nginx-ecr
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: LoadBalancer
